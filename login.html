<!-- LOCAL DEV SHELL HOOK (fail-closed, never active on remote hosts) -->
<script>
  (function () {
    try {
      var h = (window.location.hostname || '').toLowerCase();
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '' || h === '::1';
      var optIn = new URLSearchParams(window.location.search).get('dev') === '1' ||
        sessionStorage.getItem('acpm_dev_shell') === '1';
      if (isLocal && optIn) {
        document.write('<script src="dev/dev-bypass.js?v=1"><\/script>');
      }
    } catch (e) {}
  })();
</script>
<script src="auth.js?v=98"></script>
<script src="main.js?v=109"></script>
<style>
  /* ── Premium Login Experience ───────────────────────── */
  .auth-login-page {
    --auth-accent: #7c3aed;
    --auth-accent-glow: rgba(124, 58, 237, 0.25);
    --auth-surface: #0f1117;
    --auth-card-bg: #16181f;
    --auth-card-border: rgba(46, 51, 64, 0.6);
    --auth-text: #e2e8f0;
    --auth-text-dim: #64748b;
    --auth-input-bg: #0f1117;
    --auth-input-border: #1e2230;
    --auth-input-focus: #7c3aed;
  }

  [data-theme="light"] .auth-login-page {
    --auth-surface: #f4f5f9;
    --auth-card-bg: #ffffff;
    --auth-card-border: rgba(226, 232, 240, 0.8);
    --auth-text: #0f172a;
    --auth-text-dim: #64748b;
    --auth-input-bg: #f8fafc;
    --auth-input-border: #e2e8f0;
    --auth-input-focus: #7c3aed;
  }

  .auth-login-page .app-loading {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--auth-surface);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Subtle background pattern */
  .auth-login-page .app-loading::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 50%, rgba(124, 58, 237, 0.03) 0%, transparent 70%),
      radial-gradient(ellipse 500px 300px at 80% 30%, rgba(15, 118, 110, 0.03) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 50% 80%, rgba(245, 158, 11, 0.02) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-login-page .app-loading-card {
    position: relative;
    background: var(--auth-card-bg);
    border: 1px solid var(--auth-card-border);
    border-radius: 20px;
    padding: 48px 40px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow:
      0 0 0 1px rgba(124, 58, 237, 0.05),
      0 24px 80px rgba(0, 0, 0, 0.5),
      0 8px 32px rgba(0, 0, 0, 0.3);
    animation: acpm-fade-in-scale 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .auth-login-page .auth-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #7c3aed 0% 60%, #f59e0b 60% 100%);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
    letter-spacing: -1px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .auth-login-page .auth-logo:hover {
    transform: scale(1.05) rotate(-2deg);
  }

  .auth-login-page .app-loading-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--auth-text);
    margin-bottom: 6px;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .auth-login-page .app-loading-sub {
    font-size: 14px;
    color: var(--auth-text-dim);
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .auth-login-page .app-loading-sub::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--auth-accent);
    margin-left: 8px;
    animation: acpm-pulse 1.5s ease-in-out infinite;
    vertical-align: middle;
  }

  .auth-login-page .app-loading-card > div:last-child {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--auth-card-border);
  }

  .auth-login-page .app-loading-card small {
    font-size: 12px;
    color: var(--auth-text-dim);
    display: block;
    line-height: 1.6;
    opacity: 0.7;
  }

  .auth-login-page .app-loading-card small strong {
    color: var(--auth-text);
    font-weight: 500;
    opacity: 1;
  }

  /* Loading bar animation */
  .auth-login-page .auth-loading-bar {
    width: 120px;
    height: 3px;
    background: rgba(124, 58, 237, 0.1);
    border-radius: 2px;
    margin: 20px auto 0;
    overflow: hidden;
    position: relative;
  }

  .auth-login-page .auth-loading-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--auth-accent), transparent);
    border-radius: 2px;
    animation: authLoadingSlide 1.2s ease-in-out infinite;
  }

  @keyframes authLoadingSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  /* Version badge */
  .auth-login-page .auth-version {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--auth-text-dim);
    opacity: 0.4;
    letter-spacing: 0.5px;
    font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
  }

  [data-theme="light"] .auth-login-page .app-loading {
    background: linear-gradient(160deg, #f0f2f5 0%, #e4e7ee 100%);
  }

  [data-theme="light"] .auth-login-page .app-loading::before {
    background:
      radial-gradient(ellipse 600px 400px at 20% 50%, rgba(124, 58, 237, 0.04) 0%, transparent 70%),
      radial-gradient(ellipse 500px 300px at 80% 30%, rgba(15, 118, 110, 0.04) 0%, transparent 70%);
  }

  [data-theme="light"] .auth-login-page .app-loading-card {
    box-shadow:
      0 0 0 1px rgba(124, 58, 237, 0.08),
      0 24px 80px rgba(0, 0, 0, 0.08),
      0 8px 32px rgba(0, 0, 0, 0.04);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .auth-login-page .app-loading-card {
      padding: 36px 24px 32px;
      border-radius: 16px;
    }
    .auth-login-page .auth-logo {
      width: 56px;
      height: 56px;
      font-size: 24px;
    }
    .auth-login-page .app-loading-title {
      font-size: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .auth-login-page .app-loading-card {
      animation: none;
    }
    .auth-login-page .auth-loading-bar::after {
      animation: none;
      left: 0;
      width: 60%;
    }
  }
</style>
</head>
<body class="auth-checking auth-locked auth-login-page">

        <div class="app-loading-title">ACPM</div>

      <div>
        <small>
          <strong>LeBuild Design &amp; Construction</strong><br>
          Project Management System
        </small>
      </div>
    </div>
  </div>
  <div class="auth-version">v0.9.0</div>
</body>
