<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>ACPM Login - LeBuild Construction</title>
<link rel="stylesheet" href="style.css?v=104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script>window.ACPM_PAGE = 'login';</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="utils.js?v=85"></script>
<script src="auth.js?v=96"></script>
<script src="main.js?v=103"></script>
<style>
  .auth-login-page .app-loading {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
    padding: 20px;
  }
  .auth-login-page .app-loading-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 40px 36px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .auth-login-page .auth-logo {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--purple) 0 72%, var(--amber) 72% 100%);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(124,58,237,0.35);
  }
  .auth-login-page .app-loading-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .auth-login-page .app-loading-sub {
    font-size: 13px;
    color: var(--muted);
  }
  .auth-login-page .app-loading-sub::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--purple);
    margin-left: 6px;
    animation: loadingDots 1.5s ease-in-out infinite;
  }
  @keyframes loadingDots {
    0%, 20% { opacity: 0; }
    50% { opacity: 1; }
    80%, 100% { opacity: 0; }
  }
  .auth-login-page .app-loading-card > div:last-child {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .auth-login-page .app-loading-card small {
    font-size: 11px;
    color: var(--muted2);
    display: block;
    line-height: 1.5;
  }
  [data-theme="light"] .auth-login-page .app-loading {
    background: linear-gradient(135deg, #f4f5f9 0%, #e8eaf0 100%);
  }
  [data-theme="light"] .auth-login-page .app-loading-card {
    box-shadow: 0 24px 64px rgba(0,0,0,0.08);
  }
</style>
</head>
<body class="auth-checking auth-locked auth-login-page">
<div id="appLoading" class="app-loading" role="status" aria-live="polite">
  <div class="app-loading-card">
    <div class="auth-logo">LB</div>
    <div>
      <div class="app-loading-title">ACPM</div>
      <div class="app-loading-sub">Loading your workspace</div>
    </div>
    <div>
      <small>LeBuild Design &amp; Construction<br>Project Management System</small>
    </div>
  </div>
</div>
</body>
</html>
