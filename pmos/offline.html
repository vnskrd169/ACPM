<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACPM PMOS — Offline</title>
<style>
  body {
    background: #121417; color: #f0f2f8; font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
    padding: 24px; text-align: center;
  }
  .offline-card {
    max-width: 340px; padding: 32px 24px;
    background: #181b20; border: 1px solid #252a38; border-radius: 12px;
  }
  .offline-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
  h1 { font-size: 18px; margin: 0 0 8px; color: #c8cde0; }
  p { font-size: 13px; color: #6b7490; line-height: 1.5; margin: 0 0 20px; }
  .btn-retry {
    display: inline-block; padding: 10px 24px; border-radius: 8px;
    background: #7c3aed; color: #fff; font-weight: 700; font-size: 13px;
    text-decoration: none; cursor: pointer; border: none;
  }
  .btn-retry:hover { background: #9333ea; }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">&#x1F4E1;&#xFE0F;</div>
    <h1>You are offline</h1>
    <p>PMOS is running in offline mode. Existing drafts and queued records are available. New submissions will sync when connectivity is restored.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
