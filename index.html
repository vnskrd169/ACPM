<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex">
<title>Opening ACPM</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: #0d1017;
    color: #eef2ff;
  }
  .route-status {
    display: grid;
    justify-items: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  .route-mark {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #7c3aed;
    box-shadow: 0 10px 28px rgba(124, 58, 237, 0.28);
    font-weight: 800;
  }
  .route-status p {
    margin: 0;
    color: #a5b4d4;
    font-size: 14px;
  }
</style>
</head>
<body>
  <main class="route-status" aria-live="polite">
    <div class="route-mark" aria-hidden="true">LB</div>
    <p>Opening ACPM...</p>
  </main>
<script>
(function routeLegacyEntry() {
  var suffix = window.location.search + window.location.hash;
  window.location.replace('./login.html' + suffix);
})();
</script>
</body>
</html>
