<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- PMOS stacked logo for vertical layouts -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#111827"/>
  <rect x="10" y="10" width="180" height="180" rx="24" stroke="#0f766e" stroke-width="1.5"/>
  <!-- P -->
  <rect x="40" y="50" width="10" height="100" rx="3" fill="#0f766e"/>
  <rect x="40" y="50" width="50" height="10" rx="3" fill="#0f766e"/>
  <rect x="70" y="50" width="10" height="40" rx="3" fill="#0f766e"/>
  <rect x="40" y="85" width="50" height="10" rx="3" fill="#0f766e"/>
  <!-- M -->
  <rect x="90" y="50" width="10" height="100" rx="3" fill="#14b8a6"/>
  <rect x="105" y="70" width="10" height="80" rx="3" fill="#14b8a6"/>
  <rect x="120" y="50" width="10" height="100" rx="3" fill="#14b8a6"/>
  <!-- O -->
  <circle cx="155" cy="100" r="28" stroke="#06b6d4" stroke-width="8" fill="none"/>
  <!-- S -->
  <path d="M95 138 L80 138" stroke="#2dd4bf" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="100" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle" letter-spacing="3">PMOS</text>
